# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint for the Sorbus WEB TIER (Node gateway + React frontend).
# The C++ file server is NOT deployed here — it runs natively on your home
# machine (see the main README). This Blueprint only stands up the cloud tier.
#
# SAME-ORIGIN SETUP: the static site proxies /api/* to the gateway via a rewrite
# rule you add in the Render dashboard (step 2 below), so the browser only ever
# talks to ONE origin (the frontend). This keeps the login cookie first-party,
# which is required for the session to survive reloads in Safari / on iOS —
# cross-site cookies are blocked there. (See the README "Security Notes".)
#
# After the first deploy you fill everything in from the RENDER DASHBOARD — you
# never edit this file. Two post-deploy steps (then redeploy the frontend):
#   1. gateway  → set API_KEY, C_Server_Route, CORS_ORIGIN (Render prompts you)
#   2. sorbus-web → Redirects/Rewrites → add a Rewrite rule:
#        Source  /api/*   Destination  https://YOUR-GATEWAY.onrender.com/api/*
#      (Render can't auto-wire another service's URL into a route, so this one
#      lives in the dashboard where you know your gateway's real URL.)
# See the README "Deploying the web tier to Render" walkthrough.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Node.js API gateway (Docker web service) ───────────────────────────────
  - type: web
    name: sorbus-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./Docker/Dockerfile.node
    dockerContext: .
    healthCheckPath: /
    envVars:
      # Auto-generated strong secrets — you never see or set these.
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      # Must match FILEAPP_API_KEY on your home C++ server (Render prompts you).
      - key: API_KEY
        sync: false
      # Your Cloudflare tunnel URL pointing at the home C++ server.
      - key: C_Server_Route
        sync: false
      # Set to your frontend (sorbus-web) URL. Not used for browser CORS in this
      # same-origin proxy setup, but the gateway still expects it to be present.
      - key: CORS_ORIGIN
        sync: false
      # Enables Secure + SameSite=None cookies.
      - key: NODE_ENV
        value: production

  # ── React frontend (static site, served on Render's CDN) ───────────────────
  - type: web
    name: sorbus-web
    runtime: static
    buildCommand: cd Frontend/Sorbus && npm ci && npm run build
    staticPublishPath: Frontend/Sorbus/dist
    envVars:
      # Leave EMPTY. The frontend calls a relative /api, which the dashboard
      # rewrite rule proxies to the gateway — keeping the whole app on one origin.
      - key: VITE_API_URL
        value: ""
    routes:
      # NOTE: the /api/* → gateway proxy rule is added in the RENDER DASHBOARD
      # after deploy (see the header + README) — it can't live here because a
      # route can't reference the gateway's auto-assigned URL. It must be placed
      # ABOVE this SPA fallback in the dashboard's rule list.
      #
      # Single-page-app fallback so deep links / refreshes resolve to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
